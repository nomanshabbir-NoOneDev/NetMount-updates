<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="NetMount: your server, as a folder on your phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 700 76px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #fff; letter-spacing: -2px; }
      .tag   { font: 400 27px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E0E7FF; }
      .chip  { font: 600 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
      .pkt   { fill: #67E8F9; }
      .pktb  { fill: #C7D2FE; }
      @keyframes toServer { from { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateX(150px); opacity: 0; } }
      @keyframes toPhone  { from { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateX(-150px); opacity: 0; } }
      .a1 { animation: toServer 2.4s linear infinite; }
      .a2 { animation: toServer 2.4s linear infinite 0.8s; }
      .a3 { animation: toServer 2.4s linear infinite 1.6s; }
      .b1 { animation: toPhone 2.4s linear infinite 0.4s; }
      .b2 { animation: toPhone 2.4s linear infinite 1.2s; }
      .b3 { animation: toPhone 2.4s linear infinite 2.0s; }
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#spot)"/>
  <g opacity="0.07" stroke="#fff" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>

  <!-- folder under a signal: the NetMount mark -->
  <g transform="translate(70 70)">
    <rect x="0" y="0" width="104" height="104" rx="26" fill="#fff" fill-opacity="0.14"/>
    <path d="M24 62 h56 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-56 a6 6 0 0 1 -6 -6 v-14 a6 6 0 0 1 6 -6z" fill="url(#glow)"/>
    <path d="M24 62 v-8 a6 6 0 0 1 6 -6 h14 l6 6 h24 a6 6 0 0 1 6 6" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M34 36 a26 26 0 0 1 36 0 M42 28 a15 15 0 0 1 20 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text class="title" x="210" y="142">NetMount</text>
  <text class="tag" x="212" y="190">Your server, as a real folder on your phone.</text>

  <!-- chips -->
  <g>
    <rect x="212" y="224" width="136" height="38" rx="19" fill="#fff" fill-opacity="0.16"/>
    <text class="chip" x="280" y="249" text-anchor="middle">WebDAV</text>
    <rect x="358" y="224" width="108" height="38" rx="19" fill="#fff" fill-opacity="0.16"/>
    <text class="chip" x="412" y="249" text-anchor="middle">SFTP</text>
    <rect x="476" y="224" width="100" height="38" rx="19" fill="#fff" fill-opacity="0.16"/>
    <text class="chip" x="526" y="249" text-anchor="middle">SMB</text>
    <rect x="586" y="224" width="130" height="38" rx="19" fill="#fff" fill-opacity="0.16"/>
    <text class="chip" x="651" y="249" text-anchor="middle">FTP / FTPS</text>
  </g>

  <!-- live link animation: phone  <->  server -->
  <g transform="translate(790 0)">
    <rect x="0" y="105" width="64" height="110" rx="14" fill="#0F172A" fill-opacity="0.55" stroke="#C7D2FE" stroke-width="3"/>
    <rect x="9" y="120" width="46" height="72" rx="6" fill="#4F46E5" fill-opacity="0.8"/>
    <circle cx="32" cy="203" r="4" fill="#C7D2FE"/>
    <rect x="344" y="108" width="62" height="104" rx="10" fill="#0F172A" fill-opacity="0.55" stroke="#C7D2FE" stroke-width="3"/>
    <rect x="354" y="120" width="42" height="14" rx="3" fill="#67E8F9" fill-opacity="0.85"/>
    <rect x="354" y="142" width="42" height="14" rx="3" fill="#67E8F9" fill-opacity="0.55"/>
    <rect x="354" y="164" width="42" height="14" rx="3" fill="#67E8F9" fill-opacity="0.35"/>
    <circle cx="396" cy="196" r="4" fill="#4ADE80"/>
    <line x1="80" y1="145" x2="330" y2="145" stroke="#C7D2FE" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <line x1="80" y1="175" x2="330" y2="175" stroke="#67E8F9" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <g transform="translate(90 0)">
      <circle class="pktb a1" cx="0" cy="145" r="6"/>
      <circle class="pktb a2" cx="0" cy="145" r="6"/>
      <circle class="pktb a3" cx="0" cy="145" r="6"/>
    </g>
    <g transform="translate(240 0)">
      <circle class="pkt b1" cx="0" cy="175" r="6"/>
      <circle class="pkt b2" cx="0" cy="175" r="6"/>
      <circle class="pkt b3" cx="0" cy="175" r="6"/>
    </g>
  </g>
</svg>
